<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatteDev Quill - Dashboard</title>
  <!-- Usa solo uno dei due CSS, in base a dove si trova il file -->
  <link rel="stylesheet" href="../assets/css/style.css">
  
</head>
<body>

  <div class="loading-screen" id="loading">
  <div class="loading-spinner"></div>
  <div>Caricamento...</div>
</div>

  <header class="topbar">
    <h1 id="dashboard-title">I tuoi documenti</h1>
    <div class="profile-island" id="profile-island" role="button" tabindex="0" aria-expanded="false">
      <img id="profile-avatar" class="profile-avatar" src="https://via.placeholder.com/40" alt="Avatar utente">
      <span id="profile-name">Utente</span>
      <div class="profile-menu" id="profile-menu">
        <a href="https://account.mattedev.com" target="_blank" rel="noopener noreferrer">Account</a>
      </div>
    </div>
    <button id="logout-btn" class="logout-inline">Logout</button>
  </header>

  <main>
    <button class="new-doc" id="new-doc-btn">Nuovo Documento</button>
    <div class="document-list" id="document-list"></div>
  </main>

  <footer class="page-footer">
    <a href="https://mattedev.com/privacy" target="_blank" rel="noopener noreferrer">Privacy</a>
    <a href="https://mattedev.com/terms" target="_blank" rel="noopener noreferrer">Termini</a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="../assets/js/dash.js"></script>
</body>
</html>
