<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatteDev Quill - Dashboard</title>
  <!-- Usa solo uno dei due CSS, in base a dove si trova il file -->
  <link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>

  <div class="loading-screen" id="loading">
  <div class="loading-spinner"></div>
  <div>Caricamento...</div>
</div>

  <header class="topbar">
    <h1 id="dashboard-title">I tuoi documenti</h1>
    <div class="profile-island" id="profile-island" role="button" tabindex="0" aria-expanded="false">
      <img id="profile-avatar" class="profile-avatar" src="https://via.placeholder.com/40" alt="Avatar utente">
      <span id="profile-name">Utente</span>
      <div class="profile-menu" id="profile-menu">
        <a href="https://account.mattedev.com" target="_blank" rel="noopener noreferrer">Account</a>
      </div>
    </div>
    <button id="logout-btn" class="logout-inline">Logout</button>
  </header>

  <main>
    <div class="dashboard-toolbar">
      <!-- Cliccando qui, l'editor capirà che deve creare un file su Firebase -->
      <a href="editor.html?action=new" id="new-doc-btn" class="new-doc-btn new-doc">
        <i data-lucide="plus"></i> Nuovo documento
      </a>

      <div class="toolbar-controls">
        <div class="search-wrap">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="doc-search" placeholder="Cerca documenti…" autocomplete="off">
        </div>

        <select id="doc-sort" class="format-select" title="Ordina documenti">
          <option value="name-asc">Nome A → Z</option>
          <option value="name-desc">Nome Z → A</option>
        </select>

        <div class="view-toggle" role="group" aria-label="Modalità visualizzazione">
          <button id="view-grid-btn" class="icon-btn active" title="Vista a griglia" aria-pressed="true"><i data-lucide="layout-grid"></i></button>
          <button id="view-list-btn" class="icon-btn" title="Vista a elenco" aria-pressed="false"><i data-lucide="list"></i></button>
        </div>
      </div>
    </div>

    <div class="document-list grid-view" id="document-list"></div>
  </main>

  <footer class="page-footer">
    <a href="https://mattedev.com/privacy" target="_blank" rel="noopener noreferrer">Privacy</a>
    <a href="https://mattedev.com/terms" target="_blank" rel="noopener noreferrer">Termini</a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="../assets/js/dash.js"></script>

  <script>
    // UI: ricerca, ordinamento, toggle vista. Indipendente da dash.js.
    (function () {
      if (window.lucide) lucide.createIcons();

      var list = document.getElementById('document-list');
      var gridBtn = document.getElementById('view-grid-btn');
      var listBtn = document.getElementById('view-list-btn');
      var searchInput = document.getElementById('doc-search');
      var sortSelect = document.getElementById('doc-sort');
      var STORAGE_KEY = 'matteDevQuillViewMode';

      function setView(mode) {
        list.classList.toggle('list-view', mode === 'list');
        list.classList.toggle('grid-view', mode !== 'list');
        gridBtn.classList.toggle('active', mode !== 'list');
        listBtn.classList.toggle('active', mode === 'list');
        gridBtn.setAttribute('aria-pressed', String(mode !== 'list'));
        listBtn.setAttribute('aria-pressed', String(mode === 'list'));
        try { localStorage.setItem(STORAGE_KEY, mode); } catch (e) {}
      }

      var savedMode = null;
      try { savedMode = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      setView(savedMode === 'list' ? 'list' : 'grid');

      gridBtn.addEventListener('click', function () { setView('grid'); });
      listBtn.addEventListener('click', function () { setView('list'); });

      searchInput.addEventListener('input', function () {
        var query = searchInput.value.trim().toLowerCase();
        var cards = list.querySelectorAll('.doc-card');
        cards.forEach(function (card) {
          var titleEl = card.querySelector('h2');
          var title = titleEl ? titleEl.textContent.toLowerCase() : '';
          card.style.display = title.includes(query) ? '' : 'none';
        });
      });

      sortSelect.addEventListener('change', function () {
        var cards = Array.prototype.slice.call(list.querySelectorAll('.doc-card'));
        var dir = sortSelect.value === 'name-desc' ? -1 : 1;
        cards.sort(function (a, b) {
          var ta = (a.querySelector('h2') || {}).textContent || '';
          var tb = (b.querySelector('h2') || {}).textContent || '';
          return dir * ta.localeCompare(tb, 'it', { sensitivity: 'base' });
        });
        cards.forEach(function (card) { list.appendChild(card); });
      });
    })();
  </script>
</body>
</html>
