<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatteDev Quill - Editor</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Editor</h1>
    <button id="back-btn">← Dashboard</button>
  </header>

  <main>
    <div class="editor-actions">
      <button id="save-btn">Salva Documento</button>
      <button id="settings-btn" class="secondary-btn">Impostazioni</button>
    </div>
    <div id="editor" contenteditable="true" placeholder="Scrivi qui..."></div>
  </main>

  <div class="modal hidden" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-content">
      <h2 id="settings-title">Impostazioni documento</h2>
      <label class="checkbox-row">
        <input type="checkbox" id="encrypt-toggle">
        Cifra il documento con password
      </label>
      <label for="password-input">Password</label>
      <input type="password" id="password-input" placeholder="Inserisci una password forte">
      <p class="warning-text">⚠️ Attenzione: la password è irrecuperabile. Se la perdi, il documento resterà illeggibile.</p>
      <div class="modal-buttons">
        <button id="delete-btn">Elimina Documento</button>
        <button id="settings-close-btn" class="secondary-btn">Chiudi e Salva</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="/assets/js/editor.js"></script>
</body>
</html>
