<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login con token</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #1f2937;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Accesso in corso</h1>
    <p>Stiamo completando l’accesso con il token ricevuto.</p>
  </div>

  <script type="module">
    import { auth } from "/assets/js/login/firebase.js";
    import { signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const EXCHANGE_URL = "https://authalias.mattedev.com/exchangeToken";
    const params = new URLSearchParams(window.location.search);
    const idToken = params.get("token") || params.get("idToken");
    const redirect = params.get("redirect") || "/";

    async function run() {
      if (!idToken) {
        document.querySelector(".card").innerHTML = "<h1>Token mancante</h1><p>Nessun token è stato ricevuto nell’URL.</p>";
        return;
      }

      try {
        const res = await fetch(EXCHANGE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken }),
        });

        if (!res.ok) {
          throw new Error("Scambio token fallito");
        }

        const { customToken } = await res.json();
        await signInWithCustomToken(auth, customToken);

        window.location.href = redirect;
      } catch (error) {
        console.error(error);
        document.querySelector(".card").innerHTML = "<h1>Autenticazione fallita</h1><p>Si è verificato un errore durante il login.</p>";
      }
    }

    run();
  </script>
</body>
</html>
